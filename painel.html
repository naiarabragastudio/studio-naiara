<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo | Naiara Braga</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <main class="painel">

        <!-- =====================================================
             CABEÇALHO
        ====================================================== -->

        <header class="topo">

            <div class="informacoes-topo">

                <span class="subtitulo">
                    STUDIO DE BELEZA
                </span>

                <h1>
                    Naiara Braga
                </h1>

                <p>
                    Painel administrativo
                </p>

            </div>


            <!-- BOTÕES DO TOPO -->

            <div class="acoes-topo">

                <button
                    type="button"
                    class="btn-voltar-site"
                    onclick="window.location.href='https://naiarabragastudio.github.io/studio-naiara/'">

                    🏠 Voltar para o site

                </button>


                <button
                    type="button"
                    id="logout"
                    class="btn-sair">

                    Sair

                </button>

            </div>

        </header>


        <!-- =====================================================
             PROCEDIMENTOS
        ====================================================== -->

        <section class="secao-procedimentos">

            <div class="titulo-secao">

                <div>

                    <span class="subtitulo">
                        GERENCIAMENTO
                    </span>

                    <h2>
                        Procedimentos
                    </h2>

                </div>


                <button
                    type="button"
                    id="recarregar"
                    class="btn-recarregar">

                    ↻ Recarregar

                </button>

            </div>


            <!-- MENSAGEM -->

            <div
                id="mensagem"
                class="mensagem"
                style="display: none;">

            </div>


            <!-- LISTA -->

            <div
                id="lista-procedimentos"
                class="lista-procedimentos">

            </div>

        </section>

    </main>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =====================================================
           CONFIGURAÇÃO SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://hyjuuzqdxdarumsqopvn.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_aaTHViraL-2HzMThmc8ekQ_BYXrjSYH";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           STORAGE
        ===================================================== */

        const STORAGE_BUCKET =
            "procedimento";


        /* =====================================================
           PROCEDIMENTOS QUE PODEM TER FOTO
        ===================================================== */

        const PROCEDIMENTOS_COM_FOTO = [

            "volume light",

            "volume brasileiro",

            "volume egipcio",

            "alongamento quadrada",

            "alongamento almond",

            "alongamento stiletto"

        ];


        /* =====================================================
           NORMALIZAR TEXTO
        ===================================================== */

        function normalizarTexto(texto) {

            return String(texto || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim();

        }


        /* =====================================================
           VERIFICAR SE PODE TER FOTO
        ===================================================== */

        function podeTerFoto(nome) {

            const nomeNormalizado =
                normalizarTexto(nome);

            return PROCEDIMENTOS_COM_FOTO
                .some(item =>
                    normalizarTexto(item) === nomeNormalizado
                );

        }


        /* =====================================================
           MOSTRAR MENSAGEM
        ===================================================== */

        function mostrarMensagem(
            texto,
            tipo = "sucesso"
        ) {

            const mensagem =
                document.getElementById("mensagem");

            mensagem.textContent = texto;

            mensagem.className =
                "mensagem " + tipo;

            mensagem.style.display =
                "block";

        }


        /* =====================================================
           ESCONDER MENSAGEM
        ===================================================== */

        function esconderMensagem() {

            const mensagem =
                document.getElementById("mensagem");

            mensagem.style.display =
                "none";

        }


        /* =====================================================
           VERIFICAR LOGIN
        ===================================================== */

        async function verificarLogin() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (
                error ||
                !data ||
                !data.session
            ) {

                window.location.href =
                    "admin.html";

                return false;

            }


            return true;

        }


        /* =====================================================
           CARREGAR PROCEDIMENTOS
        ===================================================== */

        async function carregarProcedimentos() {

            esconderMensagem();


            const lista =
                document.getElementById(
                    "lista-procedimentos"
                );


            lista.innerHTML = `

                <div class="carregando">

                    Carregando procedimentos...

                </div>

            `;


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("procedimento")
                        .select("*")
                        .order("nome", {
                            ascending: true
                        });


                if (error) {

                    console.error(
                        "Erro ao carregar procedimentos:",
                        error
                    );

                    lista.innerHTML = `

                        <div class="erro">

                            Erro ao carregar os procedimentos.

                        </div>

                    `;

                    mostrarMensagem(
                        "Não foi possível carregar os procedimentos.",
                        "erro"
                    );

                    return;

                }


                if (
                    !data ||
                    data.length === 0
                ) {

                    lista.innerHTML = `

                        <div class="vazio">

                            Nenhum procedimento encontrado.

                        </div>

                    `;

                    return;

                }


                lista.innerHTML = "";


                data.forEach(
                    procedimento => {

                        criarCardProcedimento(
                            procedimento
                        );

                    }
                );


            } catch (erro) {

                console.error(
                    "Erro inesperado:",
                    erro
                );


                lista.innerHTML = `

                    <div class="erro">

                        Ocorreu um erro inesperado.

                    </div>

                `;

            }

        }


        /* =====================================================
           CRIAR CARD
        ===================================================== */

        function criarCardProcedimento(
            procedimento
        ) {

            const lista =
                document.getElementById(
                    "lista-procedimentos"
                );


            const card =
                document.createElement("article");

            card.className =
                "procedimento-card";


            const ativo =
                procedimento.ativo === true;


            const possuiFoto =
                podeTerFoto(
                    procedimento.nome
                );


            const preco =
                Number(
                    procedimento.preco || 0
                );


            const duracao =
                procedimento.duracao ||
                "Não informado";


            card.innerHTML = `

                <div class="card-topo">

                    <div class="card-info">

                        <span class="categoria">
                            PROCEDIMENTO
                        </span>

                        <h3>
                            ${escaparHTML(
                                procedimento.nome || ""
                            )}
                        </h3>

                    </div>


                    <span
                        class="status ${ativo ? "ativo" : "inativo"}">

                        ${ativo ? "Ativo" : "Inativo"}

                    </span>

                </div>


                <div class="informacoes">

                    <div>

                        <span>
                            PREÇO
                        </span>

                        <strong>
                            R$ ${preco.toFixed(2).replace(".", ",")}
                        </strong>

                    </div>


                    <div>

                        <span>
                            DURAÇÃO
                        </span>

                        <strong>
                            ${escaparHTML(
                                String(duracao)
                            )}
                        </strong>

                    </div>

                </div>


                <div class="editar-area">

                    <button
                        type="button"
                        class="btn-editar">

                        ✎ Editar procedimento

                    </button>

                </div>

            `;


            const botaoEditar =
                card.querySelector(
                    ".btn-editar"
                );


            botaoEditar.addEventListener(
                "click",
                () => {

                    abrirEdicao(
                        card,
                        procedimento,
                        possuiFoto
                    );

                }
            );


            lista.appendChild(card);

        }


        /* =====================================================
           ESCAPAR HTML
        ===================================================== */

        function escaparHTML(valor) {

            return String(valor)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           ABRIR EDIÇÃO
        ===================================================== */

        function abrirEdicao(
            card,
            procedimento,
            possuiFoto
        ) {

            if (
                card.classList.contains(
                    "editando"
                )
            ) {

                return;

            }


            card.classList.add(
                "editando"
            );


            const editarArea =
                card.querySelector(
                    ".editar-area"
                );


            const preco =
                Number(
                    procedimento.preco || 0
                );


            const ativo =
                procedimento.ativo === true;


            editarArea.innerHTML = `

                <div class="editar-titulo">

                    Editar procedimento

                </div>


                <div class="form-edicao">

                    <div class="campo">

                        <label>
                            Nome
                        </label>

                        <input
                            type="text"
                            class="campo-nome"
                            value="${escaparHTML(
                                procedimento.nome || ""
                            )}"
                        >

                    </div>


                    <div class="linha-campos">

                        <div class="campo">

                            <label>
                                Preço
                            </label>

                            <div class="input-prefixo">

                                <span>
                                    R$
                                </span>

                                <input
                                    type="number"
                                    step="0.01"
                                    min="0"
                                    class="campo-preco"
                                    value="${preco}"
                                >

                            </div>

                        </div>


                        <div class="campo">

                            <label>
                                Duração
                            </label>

                            <input
                                type="text"
                                class="campo-duracao"
                                value="${escaparHTML(
                                    String(
                                        procedimento.duracao || ""
                                    )
                                )}"
                            >

                        </div>

                    </div>


                    <div class="campo">

                        <label>
                            Status
                        </label>

                        <select class="campo-status">

                            <option
                                value="true"
                                ${ativo ? "selected" : ""}>

                                Ativo

                            </option>

                            <option
                                value="false"
                                ${!ativo ? "selected" : ""}>

                                Inativo

                            </option>

                        </select>

                    </div>


                    ${
                        possuiFoto
                            ? `

                    <div class="campo">

                        <label>
                            Foto do procedimento
                        </label>

                        <input
                            type="file"
                            class="input-foto"
                            accept="image/*"
                        >

                        <small class="ajuda-foto">

                            Escolha uma nova foto somente se quiser
                            substituir a atual.

                        </small>

                        ${
                            procedimento.foto
                                ? `

                            <img
                                src="${escaparHTML(
                                    procedimento.foto
                                )}"
                                class="preview-foto"
                                alt="Foto atual"
                            >

                        `
                                : ""
                        }

                    </div>

                    `
                            : ""
                    }


                    <div class="botoes-edicao">

                        <button
                            type="button"
                            class="btn-cancelar">

                            Cancelar

                        </button>


                        <button
                            type="button"
                            class="btn-salvar">

                            Salvar alterações

                        </button>

                    </div>

                </div>

            `;


            const botaoCancelar =
                editarArea.querySelector(
                    ".btn-cancelar"
                );


            const botaoSalvar =
                editarArea.querySelector(
                    ".btn-salvar"
                );


            botaoCancelar.addEventListener(
                "click",
                () => {

                    card.classList.remove(
                        "editando"
                    );

                    editarArea.innerHTML = `

                        <button
                            type="button"
                            class="btn-editar">

                            ✎ Editar procedimento

                        </button>

                    `;


                    editarArea
                        .querySelector(
                            ".btn-editar"
                        )
                        .addEventListener(
                            "click",
                            () => {

                                abrirEdicao(
                                    card,
                                    procedimento,
                                    possuiFoto
                                );

                            }
                        );

                }
            );


            botaoSalvar.addEventListener(
                "click",
                async () => {

                    await salvarProcedimento(
                        card,
                        procedimento,
                        possuiFoto
                    );

                }
            );

        }


        /* =====================================================
           SALVAR PROCEDIMENTO
        ===================================================== */

        async function salvarProcedimento(
            card,
            procedimento,
            possuiFoto
        ) {

            const nome =
                card.querySelector(
                    ".campo-nome"
                ).value.trim();


            const preco =
                Number(
                    card.querySelector(
                        ".campo-preco"
                    ).value
                );


            const duracao =
                card.querySelector(
                    ".campo-duracao"
                ).value.trim();


            const ativo =
                card.querySelector(
                    ".campo-status"
                ).value === "true";


            if (!nome) {

                alert(
                    "Digite o nome do procedimento."
                );

                return;

            }


            if (
                isNaN(preco) ||
                preco < 0
            ) {

                alert(
                    "Digite um preço válido."
                );

                return;

            }


            const botaoSalvar =
                card.querySelector(
                    ".btn-salvar"
                );


            botaoSalvar.disabled =
                true;


            botaoSalvar.textContent =
                "Salvando...";


            try {

                let fotoURL =
                    procedimento.foto || null;


                /* =================================================
                   UPLOAD DE FOTO
                ================================================== */

                if (possuiFoto) {

                    const inputFoto =
                        card.querySelector(
                            ".input-foto"
                        );


                    if (
                        inputFoto &&
                        inputFoto.files &&
                        inputFoto.files.length > 0
                    ) {

                        const arquivo =
                            inputFoto.files[0];


                        const extensao =
                            arquivo.name
                                .split(".")
                                .pop()
                                .toLowerCase();


                        const nomeArquivo =
                            normalizarTexto(nome)
                                .replace(/\s+/g, "-");


                        const caminho =
                            `${nomeArquivo}-${Date.now()}.${extensao}`;


                        const {
                            error:
                                uploadError
                        } =
                            await supabaseClient
                                .storage
                                .from(
                                    STORAGE_BUCKET
                                )
                                .upload(
                                    caminho,
                                    arquivo,
                                    {
                                        upsert: true
                                    }
                                );


                        if (uploadError) {

                            console.error(
                                uploadError
                            );

                            throw new Error(
                                "Erro ao enviar a foto."
                            );

                        }


                        const {
                            data:
                                publicData
                        } =
                            supabaseClient
                                .storage
                                .from(
                                    STORAGE_BUCKET
                                )
                                .getPublicUrl(
                                    caminho
                                );


                        fotoURL =
                            publicData.publicUrl;

                    }

                }


                /* =================================================
                   ATUALIZAR BANCO
                ================================================== */

                const dadosAtualizados = {

                    nome: nome,

                    name: nome,

                    preco: preco,

                    duracao: duracao,

                    ativo: ativo

                };


                if (possuiFoto) {

                    dadosAtualizados.foto =
                        fotoURL;

                }


                const {
                    error
                } =
                    await supabaseClient
                        .from("procedimento")
                        .update(
                            dadosAtualizados
                        )
                        .eq(
                            "id",
                            procedimento.id
                        );


                if (error) {

                    console.error(
                        "Erro ao atualizar:",
                        error
                    );

                    throw new Error(
                        "Erro ao salvar as alterações."
                    );

                }


                mostrarMensagem(
                    "Procedimento atualizado com sucesso!",
                    "sucesso"
                );


                await carregarProcedimentos();


            } catch (erro) {

                console.error(
                    erro
                );


                mostrarMensagem(
                    erro.message ||
                    "Erro ao salvar procedimento.",
                    "erro"
                );


                botaoSalvar.disabled =
                    false;


                botaoSalvar.textContent =
                    "Salvar alterações";

            }

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        document
            .getElementById("logout")
            .addEventListener(
                "click",
                async () => {

                    await supabaseClient
                        .auth
                        .signOut();


                    window.location.href =
                        "admin.html";

                }
            );


        /* =====================================================
           RECARREGAR
        ===================================================== */

        document
            .getElementById("recarregar")
            .addEventListener(
                "click",
                async () => {

                    await carregarProcedimentos();

                }
            );


        /* =====================================================
           INICIALIZAÇÃO
        ===================================================== */

        async function iniciarPainel() {

            const logado =
                await verificarLogin();


            if (!logado) {

                return;

            }


            await carregarProcedimentos();

        }


        iniciarPainel();

    </script>

</body>

</html>
