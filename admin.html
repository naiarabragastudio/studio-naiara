<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Área Administrativa | Naiara Braga</title>


    <!-- =====================================================
         FONTES
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS DO LOGIN
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./login.css"
    >


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <div class="login-container">


        <!-- LOGO -->

        <div class="logo">

            <h1>
                Naiara Braga
            </h1>

            <p>
                Área Administrativa
            </p>

        </div>


        <!-- FORMULÁRIO -->

        <form id="login-form">


            <!-- E-MAIL -->

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- SENHA -->

            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                class="btn-login"
                id="login-button"
            >

                Entrar

            </button>


        </form>


        <!-- MENSAGEM -->

        <div
            id="mensagem"
            class="mensagem"
        ></div>


        <!-- VOLTAR -->

        <a
            href="index.html"
            class="voltar"
        >

            ← Voltar para o site

        </a>


    </div>


    <!-- =====================================================
         JAVASCRIPT DO LOGIN
    ====================================================== -->

    <script>


        /* =====================================================
           CONFIGURAÇÃO DO SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://hyjuuzqdxdarumsqopvn.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_aaTHViraL-2HzMThmc8ekQ_BYXrjSYH";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const loginForm =
            document.getElementById("login-form");


        const loginButton =
            document.getElementById("login-button");


        const mensagem =
            document.getElementById("mensagem");


        /* =====================================================
           LOGIN
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                /* ---------------------------------------------
                   LIMPAR MENSAGEM
                --------------------------------------------- */

                mensagem.textContent = "";

                mensagem.className =
                    "mensagem";


                /* ---------------------------------------------
                   DESABILITAR BOTÃO
                --------------------------------------------- */

                loginButton.disabled = true;

                loginButton.textContent =
                    "Entrando...";


                /* ---------------------------------------------
                   AUTENTICAR NO SUPABASE
                --------------------------------------------- */

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                /* ---------------------------------------------
                   ERRO
                --------------------------------------------- */

                if (error) {

                    console.error(
                        "Erro no login:",
                        error
                    );


                    mensagem.textContent =
                        "E-mail ou senha incorretos.";


                    mensagem.classList.add(
                        "erro"
                    );


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Entrar";


                    return;

                }


                /* ---------------------------------------------
                   LOGIN REALIZADO
                --------------------------------------------- */

                console.log(
                    "Login realizado:",
                    data
                );


                mensagem.textContent =
                    "Login realizado com sucesso!";


                mensagem.classList.add(
                    "sucesso"
                );


                /* ---------------------------------------------
                   IR PARA O PAINEL
                --------------------------------------------- */

                setTimeout(() => {

                    window.location.href =
                        "painel.html";

                }, 500);

            }
        );


    </script>


</body>

</html>
